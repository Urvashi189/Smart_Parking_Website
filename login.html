<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ANPR System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1e3c72 50%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        
        .title {
            font-size: 40px;
            font-weight: bold;
            margin-top: -10px;  
        }

        /* subtitle spacing */
        .subtitle {
            font-size: 18px;
            color: gray;
            margin-top: 5px;
        }
        .container {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            width: 220px;   /* increase size here */
            height: auto; /* increase size here */
            border-radius: 50%;
        }
        /* Animated background */
        .logo-img {
            height: 220px;
            width: 220px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            z-index: 10;
            position: relative;
            transform: scale(1);
            animation: zoomIn 0.8s ease-out forwards;
        }
        
        .background-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .blob {
            position: absolute;
            background: radial-gradient(circle at 30% 50%, rgba(255, 107, 53, 0.3) 0%, transparent 50%);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .blob1 {
            width: 400px;
            height: 400px;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            right: -50px;
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 10px;   /* ✅ increase padding */
            width: 100%;
            max-width: 550px;
            max-height: 700px;
            display: flex;        /* ✅ better vertical alignment */
            flex-direction: column;
            justify-content: center;
            animation: slideUp 0.6s ease-out;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-icon {
            font-size: 50px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-header h1 {
            color: #0f1419;
            margin-bottom: 8px;
            font-size: 40px;
        }

        .login-header p {
            color: #7f8c8d;
            font-size: 20px;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #0f1419;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ff6b35;
            background: white;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.2);
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: #bbb;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b35 0%, #e74c3c 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 107, 53, 0.4);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .error {
            background-color: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error::before {
            content: "⚠️";
            font-size: 18px;
        }

        .demo-credentials {
            background: linear-gradient(135deg, #f0f4f8 0%, #e8f0f7 100%);
            border: 2px solid #1e3c72;
            border-left: 4px solid #ff6b35;
            padding: 18px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 13px;
            color: #0f1419;
        }

        .demo-credentials h3 {
            margin-bottom: 12px;
            color: #0f1419;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .demo-credentials h3::before {
            content: "🔓";
            font-size: 18px;
        }

        .demo-credentials p {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .demo-credentials strong {
            color: #ff6b35;
            font-weight: 700;
        }

        .credentials-role {
            background: #ff6b35;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .system-info {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ecf0f1;
            color: #7f8c8d;
            font-size: 12px;
        }

        .system-info p {
            margin: 5px 0;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    

    <div class="background-animation">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
    </div>

    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="HawkEye Logo" class="logo-img">
            </div>
            <h1 class="title">Hawkeye 2.0</h1>
            <p class="subtitle">Automatic Number Plate Recognition</p>
        </div>


        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="user_id">User ID</label>
                <input 
                    type="text" 
                    id="user_id" 
                    name="user_id" 
                    placeholder="Enter your user ID"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <input 
                        type="password" 
                        id="myInput" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                        pattern="^(?=.*[^A-Za-z0-9]).{8,}$"
                        style="width:100%;"
                    >
                 <small id="passwordError" style="color:red; display:none;">
                    Password must be 8+ characters and include a special character
                </small>

            <div class="form-group">
                <label for="Show Password">
                <div style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    
                    <input 
                        type="checkbox" 
                        onclick="togglePassword()"
                        id="ShowPassword" 
                        name="ShowPassword" 
                        placeholder="Show Password"
                        style="width: auto;"
                    >
                    <span>Show Password</span></label>
                </div>
            </div>
                    

                </div>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>

        

        <div class="system-info">
            <p><span class="status-indicator"></span>System Online - All Cameras Active</p>
            <p>Hawkeye 2.0</p>
        </div>
    </div>
    <script>

        
        function togglePassword() {
            var pwd = document.querySelector('input[name="password"]');
            pwd.type = (pwd.type === "password") ? "text" : "password";
        }

        const password = document.getElementById("myInput");
        const error = document.getElementById("passwordError");

        password.addEventListener("input", function () {
        const regex = /^(?=.*[!@#$%^&*(),.?":{}|<>]).{8,}$/;

        if (!regex.test(password.value)) {
            error.style.display = "block";
        } else {
            error.style.display = "none";
        }
        });
        

    </script>
</body>
</html>
